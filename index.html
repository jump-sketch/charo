<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>好きな顔選抜</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f7;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid #ddd;
  padding: 18px 15px 14px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 23px;
}

p {
  margin: 5px 0 0;
  font-size: 12px;
  color: #777;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-top: 13px;
}

.tabs button {
  border: 1px solid #ccc;
  background: white;
  border-radius: 30px;
  padding: 7px 16px;
}

.tabs button.active {
  background: #222;
  color: white;
}

#search {
  display: block;
  width: calc(100% - 24px);
  max-width: 900px;
  margin: 15px auto 10px;
  padding: 12px 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 14px;
}

#count {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-bottom: 12px;
}

.grid {
  width: calc(100% - 24px);
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding-bottom: 100px;
}

.card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid transparent;
  cursor: pointer;
  transition: .15s;
}

.card.selected {
  border-color: #222;
}

.photo {
  position: relative;
  aspect-ratio: 3 / 4;
  background: #eee;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.check {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid #ccc;
}

.selected .check {
  background: #222;
  color: white;
}

.name {
  text-align: center;
  font-weight: bold;
  padding: 10px 5px 3px;
}

.group {
  text-align: center;
  color: #888;
  font-size: 10px;
  padding-bottom: 10px;
}

.bottom {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #ddd;
  padding: 12px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#next {
  border: 0;
  background: #222;
  color: white;
  border-radius: 30px;
  padding: 11px 25px;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>好きな顔選抜</h1>
  <p>好きなメンバーを選んでね♡</p>

  <div class="tabs">
    <button class="active" data-type="all">ALL</button>
    <button data-type="junior">ジュニア</button>
    <button data-type="starto">STARTO</button>
  </div>
</header>

<input
  id="search"
  type="search"
  placeholder="名前を検索..."
>

<div id="count"></div>

<main id="grid" class="grid"></main>

<div class="bottom">
  <div>
    選択中：
    <strong id="selectedCount">0</strong>人
  </div>

  <button id="next">次へ →</button>
</div>

<script>

let members = [];
let selected = new Set();
let type = "all";

async function loadMembers() {

  try {

    const response = await fetch("./data.json");

    if (!response.ok) {
      throw new Error("data.jsonを読み込めません");
    }

    members = await response.json();

    render();

  } catch (error) {

    document.getElementById("grid").innerHTML = `
      <p style="grid-column:1/-1;text-align:center">
        data.jsonを読み込めませんでした。
      </p>
    `;

    console.error(error);
  }
}

function render() {

  const keyword =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const filtered = members.filter(member => {

    const typeOK =
      type === "all" ||
      member.type === type;

    const searchOK =
      !keyword ||
      member.name.toLowerCase().includes(keyword);

    return typeOK && searchOK;
  });

  document.getElementById("count").textContent =
    `${filtered.length}人`;

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  filtered.forEach(member => {

    const card =
      document.createElement("div");

    card.className =
      "card" +
      (selected.has(member.name)
        ? " selected"
        : "");

    card.innerHTML = `
      <div class="photo">

        <img
          src="${member.image}"
          alt="${member.name}"
          loading="lazy"
        >

        <div class="check">
          ${selected.has(member.name) ? "✓" : ""}
        </div>

      </div>

      <div class="name">
        ${member.name}
      </div>

      <div class="group">
        ${member.group || ""}
      </div>
    `;

    card.onclick = () => {

      if (selected.has(member.name)) {
        selected.delete(member.name);
      } else {
        selected.add(member.name);
      }

      document.getElementById("selectedCount")
        .textContent = selected.size;

      render();
    };

    grid.appendChild(card);
  });
}

document.querySelectorAll(".tabs button")
.forEach(button => {

  button.onclick = () => {

    document.querySelectorAll(".tabs button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    type = button.dataset.type;

    render();
  };

});

document.getElementById("search")
.addEventListener("input", render);

document.getElementById("next")
.onclick = () => {

  if (selected.size === 0) {
    alert("1人以上選んでね！");
    return;
  }

  alert(
    "選択したメンバー\n\n" +
    [...selected].join("\n")
  );
};

loadMembers();

</script>

</body>
</html>
